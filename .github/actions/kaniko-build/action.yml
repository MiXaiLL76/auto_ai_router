name: kaniko-build
description: >
  Build and push an image with kaniko, reading extra kaniko flags (one per
  line) from /github/workspace/.kaniko-args written by the caller. Runs as a
  Docker container action (no daemon needed — required under ARC's
  containerMode: kubernetes, which has no dind). The flag count/values are
  dynamic (variable number of tags/labels), and action.yml's args: is a
  static YAML list, so instead of listing flags there we run a tiny shell
  script (kaniko's -debug image ships busybox sh) that builds argv from the
  file at runtime via `set --`. entrypoint is set explicitly rather than
  left to the image default.
runs:
  using: docker
  image: docker://gcr.io/kaniko-project/executor:v1.24.0-debug
  entrypoint: /busybox/sh
  args:
    - -c
    - |
      set --
      while IFS= read -r line; do
        [ -z "$line" ] && continue
        set -- "$@" "$line"
      done < /github/workspace/.kaniko-args
      exec /kaniko/executor "$@"
