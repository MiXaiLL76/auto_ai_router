name: CI
on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  actions: read 

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
