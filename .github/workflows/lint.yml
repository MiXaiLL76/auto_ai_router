name: Lint

# Every check is its own job, so the PR checks list says exactly what broke
# ("govulncheck" red, everything else green) instead of one "Lint Code" job
# whose cause is buried in a summary table. Each job:
#   - fails on its own, with a single ::error annotation naming the cause
#     and the local command that reproduces it;
#   - retries its network-bound setup (go mod download / go install), so a
#     transient proxy.golang.org / sum.golang.org hiccup doesn't read as a
#     lint failure;
#   - reports exit 137 as what it is on arc-air-runners — the pod was
#     SIGKILLed, almost always OOMKilled — not as a finding. After such a
#     kill the ARC container hook breaks and every later step of that job
#     fails with "TypeError: Converting circular structure to JSON"; that
#     message is noise, look for the first failing step.

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  MIN_COVERAGE: 72

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
  workflow_call:

# A new push to a PR supersedes the previous run: cancel it instead of
# letting both fight for runner memory. Pushes to main/develop and release
# runs (workflow_call) are never cancelled.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gofmt:
    name: gofmt
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: false

    - name: Check formatting
      run: |
        files=$(gofmt -s -l .)
        if [ -n "$files" ]; then
          echo "$files"
          count=$(echo "$files" | wc -l)
          {
            echo "## gofmt: ${count} unformatted file(s)"
            echo '```'
            echo "$files"
            echo '```'
            echo "Fix locally: \`make format\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=gofmt::${count} unformatted file(s) — run 'make format'"
          exit 1
        fi
        echo "## gofmt: OK" >> "$GITHUB_STEP_SUMMARY"

  vet:
    name: go vet
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    - name: Download modules
      run: |
        for i in 1 2 3; do go mod download && exit 0; echo "retry $i/3..."; sleep 15; done
        echo "::error title=go mod download::could not download modules after 3 attempts — network/proxy problem, not a code problem; re-run"
        exit 1

    - name: Run go vet
      run: |
        set +e
        go vet ./... > vet.log 2>&1
        status=$?
        cat vet.log
        if [ "$status" -eq 137 ]; then
          echo "::error title=go vet killed::exit 137 (SIGKILL) — runner pod most likely OOMKilled; re-run, raise arc-air-runners memory if it repeats"
          exit 1
        fi
        if [ "$status" -ne 0 ]; then
          {
            echo "## go vet: failed"
            echo '```'
            cat vet.log
            echo '```'
            echo "Reproduce locally: \`make vet\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=go vet::go vet reported issues — see log; run 'make vet'"
          exit 1
        fi
        echo "## go vet: OK" >> "$GITHUB_STEP_SUMMARY"

  golangci:
    name: golangci-lint
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
      run: |
        for i in 1 2 3; do
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} && exit 0
          echo "retry $i/3..."; sleep 15
        done
        echo "::error title=golangci-lint install::could not install golangci-lint after 3 attempts — network/proxy problem, not a code problem; re-run"
        exit 1

    - name: Run golangci-lint
      run: |
        set +e
        golangci-lint run --timeout=5m --max-issues-per-linter=0 --max-same-issues=0 ./... > golangci.log 2>&1
        status=$?
        cat golangci.log
        if [ "$status" -eq 137 ]; then
          echo "::error title=golangci-lint killed::exit 137 (SIGKILL) — runner pod most likely OOMKilled; re-run, raise arc-air-runners memory if it repeats"
          exit 1
        fi
        issues=$(grep -cE '^\S+\.go:[0-9]+:[0-9]+:' golangci.log || true)
        gosec=$(grep -cE '^\S+\.go:[0-9]+:[0-9]+:.*\(gosec\)' golangci.log || true)
        if [ "$status" -ne 0 ]; then
          {
            echo "## golangci-lint: ${issues} issue(s), ${gosec} from gosec"
            echo '```'
            cat golangci.log
            echo '```'
            echo "Reproduce locally: \`make lint\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=golangci-lint::${issues} issue(s) (${gosec} gosec) — run 'make lint'"
          exit 1
        fi
        echo "## golangci-lint: OK" >> "$GITHUB_STEP_SUMMARY"

  govulncheck:
    name: govulncheck
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    # Unpinned on purpose: the tool and the vulnerability DB move together,
    # and a fresh advisory must fail here the same day. Mirrors `make vuln`.
    - name: Install govulncheck
      run: |
        for i in 1 2 3; do go install golang.org/x/vuln/cmd/govulncheck@latest && exit 0; echo "retry $i/3..."; sleep 15; done
        echo "::error title=govulncheck install::could not install govulncheck after 3 attempts — network/proxy problem, not a code problem; re-run"
        exit 1

    - name: Run govulncheck
      run: |
        set +e
        govulncheck ./... > govulncheck.log 2>&1
        status=$?
        cat govulncheck.log
        if [ "$status" -eq 137 ]; then
          echo "::error title=govulncheck killed::exit 137 (SIGKILL) — runner pod most likely OOMKilled; re-run, raise arc-air-runners memory if it repeats"
          exit 1
        fi
        vulns=$(grep -cE '^Vulnerability #' govulncheck.log || true)
        if [ "$status" -ne 0 ]; then
          {
            if [ "$vulns" -gt 0 ]; then
              echo "## govulncheck: ${vulns} vulnerability(ies) reachable from our code"
              echo
              echo "No code change is needed to trigger this — a new advisory landed in the vulnerability DB."
              echo "Fix: bump the module(s) listed under **Fixed in** (\`go get -u ./... && go mod tidy\`), then \`make vuln\`."
            else
              echo "## govulncheck: did not complete (exit ${status})"
            fi
            echo '```'
            cat govulncheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$vulns" -gt 0 ]; then
            # One annotation per advisory, so the ID and fixed version show
            # up on the PR checks page without opening the log.
            awk '
              /^Vulnerability #/ { id=$3 }
              /^    Found in:/   { found=$3 }
              /^    Fixed in:/   { printf "::error title=govulncheck %s::%s -> fixed in %s — bump it; run make vuln\n", id, found, $3 }
            ' govulncheck.log
          else
            echo "::error title=govulncheck::govulncheck failed with exit ${status} — see log"
          fi
          exit 1
        fi
        echo "## govulncheck: no reachable vulnerabilities" >> "$GITHUB_STEP_SUMMARY"

  pre-commit:
    name: pre-commit
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install pre-commit
      run: |
        for i in 1 2 3; do pip install pre-commit && exit 0; echo "retry $i/3..."; sleep 15; done
        echo "::error title=pre-commit install::could not install pre-commit after 3 attempts — network problem, not a code problem; re-run"
        exit 1

    - name: Run pre-commit
      run: |
        set +e
        pre-commit run --all-files --show-diff-on-failure
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "## pre-commit: hooks failed or modified files — see log" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=pre-commit::hooks failed or modified files — run 'pre-commit run --all-files' (or 'make format') and commit the result"
          exit 1
        fi
        echo "## pre-commit: OK" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests & coverage
    runs-on: arc-air-runners
    container:
      image: golang:1.27
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    - name: Download modules
      run: |
        for i in 1 2 3; do go mod download && exit 0; echo "retry $i/3..."; sleep 15; done
        echo "::error title=go mod download::could not download modules after 3 attempts — network/proxy problem, not a code problem; re-run"
        exit 1

    - name: Run tests
      env:
        CGO_ENABLED: 1
      run: |
        set +e
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./... > test.log 2>&1
        status=$?
        cat test.log
        if [ "$status" -eq 137 ]; then
          echo "::error title=go test killed::exit 137 (SIGKILL) — runner pod most likely OOMKilled (-race is memory-hungry); re-run, raise arc-air-runners memory if it repeats"
          exit 1
        fi
        if [ "$status" -ne 0 ]; then
          # The full -v log is huge; surface just the failures.
          failed=$(grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)' test.log | head -50)
          {
            echo "## go test: failed"
            echo '```'
            if [ -n "$failed" ]; then echo "$failed"; else tail -50 test.log; fi
            echo '```'
            echo "Reproduce locally: \`make test-race\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "$failed" | grep -E '^--- FAIL' | head -20 | while read -r line; do
              echo "::error title=go test::${line}"
            done
            grep -q 'WARNING: DATA RACE' test.log && echo "::error title=go test::data race detected — see log"
          fi
          echo "::error title=go test::tests failed (exit ${status}) — see summary; run 'make test-race'"
          exit 1
        fi

    - name: Check coverage
      run: |
        pct=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
        echo "## Coverage: ${pct}% (threshold ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
        if [ -z "$pct" ]; then
          echo "::error title=coverage::could not compute total coverage from coverage.out"
          exit 1
        fi
        if [ "${pct%.*}" -lt "$MIN_COVERAGE" ]; then
          echo "::error title=coverage::total coverage ${pct}% is below the ${MIN_COVERAGE}% threshold — add tests"
          exit 1
        fi
