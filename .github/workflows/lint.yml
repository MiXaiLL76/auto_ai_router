name: Lint

# One job, checks run one after another in the same pod.
#
# Why one job: on arc-air-runners the per-job overhead (pod start ~50s,
# actions/setup-go download + 572 MB cache restore/save, 1-4 min) cost more
# than all the checks together (~3 min). The golang image already ships Go,
# so there is no setup-go and no Actions cache at all: `go mod download`
# from the proxy takes seconds, and a cold build is cheaper than moving the
# cache tarball around.
#
# How to read a failure:
#   - every check is its own step; a failing step goes red on its own and
#     prints one ::error annotation with the cause and the local command;
#   - all checks run even if an earlier one failed (`if: !cancelled()`), so
#     one run shows every problem at once;
#   - pre-commit runs first, before any Go setup: most failures are
#     formatting, and they should show up in ~30s, not after the build;
#   - if a process gets OOM-killed (exit 137) Kubernetes kills the whole
#     container, the step can't report anything, and every later step fails
#     with "TypeError: Converting circular structure to JSON" — ARC noise.
#     The pod has no memory limit of its own, so this is the *node* running
#     out of memory (too many heavy pods at once). The `explain` job reads the
#     log from outside and says which step died. govulncheck is the memory
#     hog (~2-3 GB), so it runs last: if it gets killed, all other checks have
#     already reported.

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  MIN_COVERAGE: 72

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
  workflow_call:

permissions:
  contents: read
  actions: read  # explain job reads this run's job log

# A new push to a PR supersedes the previous run. Pushes to main/develop and
# release runs (workflow_call) are never cancelled.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: arc-air-runners
    container:
      image: golang:1.27
    env:
      CGO_ENABLED: 1  # -race

    steps:
    - uses: actions/checkout@v6

    # Retries: a network hiccup must not read as a lint failure.
    - name: Install pre-commit
      run: |
        retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i/3: $*"; sleep 15; done; return 1; }
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        retry sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv >/dev/null' \
          || { echo "::error title=setup::apt-get install python3-venv failed 3 times — network problem, not a code problem; re-run"; exit 1; }
        python3 -m venv /opt/pre-commit
        retry /opt/pre-commit/bin/pip install -q pre-commit \
          || { echo "::error title=setup::pip install pre-commit failed 3 times — network problem, not a code problem; re-run"; exit 1; }

    - name: pre-commit
      run: |
        if ! /opt/pre-commit/bin/pre-commit run --all-files --show-diff-on-failure; then
          echo "### ❌ pre-commit: hooks failed or modified files — see log" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=pre-commit::hooks failed or modified files — run 'pre-commit run --all-files' and commit the result"
          exit 1
        fi
        echo "### ✅ pre-commit" >> "$GITHUB_STEP_SUMMARY"

    - name: Install Go tools
      if: ${{ !cancelled() }}
      run: |
        retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i/3: $*"; sleep 15; done; return 1; }
        fail() { echo "::error title=setup::$1 — network/proxy problem, not a code problem; re-run"; exit 1; }
        go version
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo unknown)
        case "$limit" in max|9223372036854*) limit="none (an OOM kill here means the node ran out of memory)" ;; esac
        echo "pod memory limit: $limit"

        retry go mod download || fail "go mod download failed 3 times"

        # Prebuilt release binary (checksum-verified): `go install` compiles
        # golangci-lint from source, which took ~60s of this step.
        v=${GOLANGCI_LINT_VERSION#v}; arch=$(go env GOARCH)
        tarball="golangci-lint-${v}-linux-${arch}.tar.gz"
        base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
        cd /tmp
        retry sh -c "curl -fsSLO '${base}/${tarball}' && curl -fsSLO '${base}/golangci-lint-${v}-checksums.txt'" \
          || fail "golangci-lint download failed 3 times"
        grep " ${tarball}\$" "golangci-lint-${v}-checksums.txt" | sha256sum -c - \
          || { echo "::error title=setup::golangci-lint ${tarball} checksum mismatch"; exit 1; }
        tar xzf "$tarball" --strip-components=1 -C /usr/local/bin "golangci-lint-${v}-linux-${arch}/golangci-lint"
        golangci-lint version
        cd "$GITHUB_WORKSPACE"

        # Unpinned on purpose, like `make vuln`: a fresh advisory must fail here the same day.
        retry go install golang.org/x/vuln/cmd/govulncheck@latest || fail "govulncheck install failed 3 times"

    - name: gofmt
      if: ${{ !cancelled() }}
      run: |
        files=$(gofmt -s -l .)
        if [ -n "$files" ]; then
          echo "$files"
          count=$(echo "$files" | wc -l)
          { echo "### ❌ gofmt: ${count} unformatted file(s)"; echo '```'; echo "$files"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=gofmt::${count} unformatted file(s) — run 'make format'"
          exit 1
        fi
        echo "### ✅ gofmt" >> "$GITHUB_STEP_SUMMARY"

    - name: go vet
      if: ${{ !cancelled() }}
      run: |
        if ! go vet ./... > vet.log 2>&1; then
          cat vet.log
          { echo "### ❌ go vet"; echo '```'; cat vet.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=go vet::go vet reported issues — see log; run 'make vet'"
          exit 1
        fi
        echo "### ✅ go vet" >> "$GITHUB_STEP_SUMMARY"

    - name: golangci-lint
      if: ${{ !cancelled() }}
      run: |
        if ! golangci-lint run --timeout=5m --max-issues-per-linter=0 --max-same-issues=0 ./... > golangci.log 2>&1; then
          cat golangci.log
          issues=$(grep -cE '^\S+\.go:[0-9]+:[0-9]+:' golangci.log || true)
          gosec=$(grep -cE '^\S+\.go:[0-9]+:[0-9]+:.*\(gosec\)' golangci.log || true)
          { echo "### ❌ golangci-lint: ${issues} issue(s), ${gosec} gosec"; echo '```'; cat golangci.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=golangci-lint::${issues} issue(s) (${gosec} gosec) — run 'make lint'"
          exit 1
        fi
        echo "### ✅ golangci-lint" >> "$GITHUB_STEP_SUMMARY"

    - name: go test -race
      if: ${{ !cancelled() }}
      run: |
        # Same method as `make test-coverage`: run every package's tests, but
        # measure coverage of ./internal/... only, counting code exercised
        # from other packages' tests too (-coverpkg). Without it the cmd/*
        # mains and cross-package calls skew the total ~5 points low.
        coverpkg=$(go list ./internal/... | paste -sd, -)
        if ! go test -v -race -coverpkg="$coverpkg" -coverprofile=coverage.out -covermode=atomic ./... > test.log 2>&1; then
          cat test.log
          # The full -v log is huge; surface just the failures.
          failed=$(grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)' test.log | head -50)
          {
            echo "### ❌ go test"
            echo '```'
            if [ -n "$failed" ]; then echo "$failed"; else tail -50 test.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$failed" | grep -E '^--- FAIL' | head -20 | while read -r line; do
            echo "::error title=go test::${line}"
          done
          grep -q 'WARNING: DATA RACE' test.log && echo "::error title=go test::data race detected — see log"
          echo "::error title=go test::tests failed — run 'make test-race'"
          exit 1
        fi
        echo "### ✅ go test" >> "$GITHUB_STEP_SUMMARY"

    - name: coverage
      if: ${{ !cancelled() }}
      run: |
        if [ ! -s coverage.out ]; then
          echo "::error title=coverage::no coverage.out — tests did not run to completion"
          exit 1
        fi
        pct=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
        echo "Total coverage: ${pct:-?}% (threshold ${MIN_COVERAGE}%)"
        if [ -z "$pct" ] || [ "${pct%.*}" -lt "$MIN_COVERAGE" ]; then
          echo "### ❌ coverage: ${pct:-?}% (threshold ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=coverage::total coverage ${pct:-?}% is below the ${MIN_COVERAGE}% threshold — add tests"
          exit 1
        fi
        echo "### ✅ coverage: ${pct}% (threshold ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
        echo "::notice title=Total coverage::${pct}% (threshold ${MIN_COVERAGE}%)"

    # Last on purpose — see the header comment.
    - name: govulncheck
      if: ${{ !cancelled() }}
      env:
        # Unbounded, govulncheck peaks at ~3.2 GB on this repo; with a soft
        # limit the GC keeps it at ~2.1 GB (slower: ~30s instead of ~10s).
        GOMEMLIMIT: 1500MiB
      run: |
        status=0
        govulncheck ./... > govulncheck.log 2>&1 || status=$?
        cat govulncheck.log
        if [ "$status" -ne 0 ]; then
          vulns=$(grep -cE '^Vulnerability #' govulncheck.log || true)
          {
            if [ "$vulns" -gt 0 ]; then
              echo "### ❌ govulncheck: ${vulns} vulnerability(ies) reachable from our code"
              echo
              echo "No code change is needed to trigger this — a new advisory landed in the vulnerability DB."
              echo "Fix: bump the module(s) listed under **Fixed in** (\`go get -u ./... && go mod tidy\`), then \`make vuln\`."
            else
              echo "### ❌ govulncheck: did not complete (exit ${status})"
            fi
            echo '```'
            cat govulncheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$vulns" -gt 0 ]; then
            # One annotation per advisory: ID, vulnerable and fixed version.
            awk '
              /^Vulnerability #/ { id=$3 }
              /^    Found in:/   { found=$3 }
              /^    Fixed in:/   { printf "::error title=govulncheck %s::%s -> fixed in %s — bump it; run make vuln\n", id, found, $3 }
            ' govulncheck.log
          else
            echo "::error title=govulncheck::govulncheck failed with exit ${status} — see log"
          fi
          exit 1
        fi
        echo "### ✅ govulncheck" >> "$GITHUB_STEP_SUMMARY"

  # Runs on a GitHub-hosted runner, outside the ARC pod, so it still works
  # when the pod was OOM-killed and could not report anything itself.
  explain:
    name: Why did Checks fail?
    needs: checks
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
    - name: Explain failure
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        ATTEMPT: ${{ github.run_attempt }}
      run: |
        # Under workflow_call the job is named "<caller job> / Checks".
        job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
          -q '[.jobs[] | select(.name == "Checks" or (.name | endswith("/ Checks")))][0]')
        job_id=$(echo "$job" | jq -r .id)
        failed_steps=$(echo "$job" | jq -r '[.steps[] | select(.conclusion == "failure") | .name] | join(", ")')
        first=$(echo "$job" | jq -r '[.steps[] | select(.conclusion == "failure") | .name][0] // "unknown"')
        gh api "repos/$REPO/actions/jobs/$job_id/logs" > job.log 2>/dev/null || true

        if grep -q 'exit code 137' job.log; then
          # Log lines start with an RFC3339 timestamp; map the 137 line onto
          # the step whose [started_at, completed_at] window contains it.
          ts=$(grep -m1 'exit code 137' job.log | cut -c1-19)
          killed=$(echo "$job" | jq -r --arg ts "${ts}Z" '
            [.steps[] | select(.started_at != null and .started_at[0:19] + "Z" <= $ts
                              and ((.completed_at // "9999")[0:19] + "Z") >= $ts) | .name][0] // empty')
          [ -n "$killed" ] || killed="$first"
          msg="'${killed}' was killed by the kernel (exit 137): the Kubernetes node ran out of memory (OOM; pods have no memory limit, see 'Install Go tools'). Not a code problem. Steps after it failing with 'Converting circular structure to JSON' are fallout, ignore them. Re-run; if it keeps happening, set resources.requests.memory (~3Gi) on arc-air-runners job pods so fewer heavy pods land on one node."
        elif grep -q 'circular structure to JSON' job.log; then
          msg="The ARC container hook broke after step '${first}' — runner infrastructure problem, not a code problem. Re-run."
        else
          msg="Failed step(s): ${failed_steps}. Open the Checks job and look at the red steps / annotations above."
        fi

        echo "::error title=Why Checks failed::${msg}"
        { echo "## Why did Checks fail?"; echo; echo "$msg"; echo; echo "Failed steps: ${failed_steps:-none}"; } >> "$GITHUB_STEP_SUMMARY"
