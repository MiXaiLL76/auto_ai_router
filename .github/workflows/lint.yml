name: Lint

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  MIN_SCORE: 80
  MIN_COVERAGE: 70

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/lint.yml'
  workflow_call:

jobs:
  lint:
    name: Lint Code
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run go fmt
      id: gofmt
      continue-on-error: true
      run: |
        set +e
        gofmt -s -l . > gofmt.log
        cat gofmt.log
        files=$(wc -l < gofmt.log)
        echo "files=${files}" >> "$GITHUB_OUTPUT"
        if [ "$files" -gt 0 ]; then exit 1; fi

    - name: Run go vet
      id: vet
      continue-on-error: true
      run: |
        set +e
        go vet ./... > vet.log 2>&1
        status=$?
        cat vet.log
        issues=$(wc -l < vet.log)
        echo "issues=${issues}" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

    - name: Run golangci-lint
      id: golangci
      continue-on-error: true
      run: |
        set +e
        golangci-lint run --timeout=5m ./... > golangci.log 2>&1
        status=$?
        cat golangci.log
        issues=$(grep -cE '^\S+\.go:[0-9]+:[0-9]+:' golangci.log || true)
        gosec_issues=$(grep -cE '^\S+\.go:[0-9]+:[0-9]+:.*\(gosec\)' golangci.log || true)
        echo "issues=${issues}" >> "$GITHUB_OUTPUT"
        echo "gosec_issues=${gosec_issues}" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      id: govulncheck
      continue-on-error: true
      run: |
        set +e
        govulncheck ./... > govulncheck.log 2>&1
        status=$?
        cat govulncheck.log
        vulns=$(grep -cE '^Vulnerability #' govulncheck.log || true)
        echo "vulns=${vulns}" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit
      id: precommit
      continue-on-error: true
      run: pre-commit run --all-files

    - name: Summary
      if: always()
      run: |
        set +e
        gofmt_files=${{ steps.gofmt.outputs.files }}
        vet_issues=${{ steps.vet.outputs.issues }}
        golangci_issues=${{ steps.golangci.outputs.issues }}
        gosec_issues=${{ steps.golangci.outputs.gosec_issues }}
        govulncheck_vulns=${{ steps.govulncheck.outputs.vulns }}

        score=100
        score=$((score - gofmt_files))
        score=$((score - vet_issues * 2))
        score=$((score - (golangci_issues - gosec_issues) / 10))
        score=$((score - gosec_issues * 3))
        score=$((score - govulncheck_vulns * 10))
        if [ "$score" -lt 0 ]; then score=0; fi

        min_score=${{ env.MIN_SCORE }}
        score_verdict="OK"
        if [ "$score" -lt "$min_score" ]; then score_verdict="BELOW THRESHOLD (< ${min_score})"; fi

        {
          echo "## Code quality report"
          echo
          echo "| Check | Result | Findings |"
          echo "|---|---|---|"
          echo "| gofmt | ${{ steps.gofmt.outcome }} | ${gofmt_files} files |"
          echo "| go vet | ${{ steps.vet.outcome }} | ${vet_issues} issues |"
          echo "| golangci-lint | ${{ steps.golangci.outcome }} | ${golangci_issues} issues (${gosec_issues} gosec) |"
          echo "| govulncheck | ${{ steps.govulncheck.outcome }} | ${govulncheck_vulns} vulnerabilities |"
          echo "| pre-commit | ${{ steps.precommit.outcome }} | - |"
          echo
          echo "**Score: ${score}/100 — ${score_verdict}** (threshold: ${min_score})"
        } >> "$GITHUB_STEP_SUMMARY"

        failed=0
        for outcome in "${{ steps.gofmt.outcome }}" "${{ steps.vet.outcome }}" "${{ steps.golangci.outcome }}" "${{ steps.govulncheck.outcome }}" "${{ steps.precommit.outcome }}"; do
          if [ "$outcome" = "failure" ]; then failed=1; fi
        done
        if [ "$score" -lt "$min_score" ]; then failed=1; fi
        if [ "$failed" -eq 1 ]; then exit 1; fi

  test:
    name: Run Tests
    runs-on: arc-air-runners
    container:
      image: golang:1.27

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      id: tests
      continue-on-error: true
      env:
        CGO_ENABLED: 1
      run: |
        set +e
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./... > test.log 2>&1
        status=$?
        cat test.log
        exit $status

    - name: Coverage
      id: coverage
      continue-on-error: true
      run: |
        set +e
        if [ ! -f coverage.out ]; then
          echo "coverage.out not found (tests likely failed before writing it)"
          echo "percent=0" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        go tool cover -func=coverage.out > coverage.log
        cat coverage.log
        pct=$(grep '^total:' coverage.log | sed -E 's/.*[[:space:]]([0-9]+\.[0-9]+)%$/\1/')
        if [ -z "$pct" ]; then pct=0; fi
        echo "percent=${pct}" >> "$GITHUB_OUTPUT"

    - name: Summary
      if: always()
      run: |
        set +e
        min_coverage=${{ env.MIN_COVERAGE }}
        coverage_pct=${{ steps.coverage.outputs.percent }}
        coverage_int=${coverage_pct%.*}
        verdict="OK"
        if [ "$coverage_int" -lt "$min_coverage" ]; then verdict="BELOW THRESHOLD (< ${min_coverage}%)"; fi

        {
          echo "## Test coverage report"
          echo
          echo "| Check | Result |"
          echo "|---|---|"
          echo "| go test | ${{ steps.tests.outcome }} |"
          echo "| coverage | ${verdict} |"
          echo
          echo "**Total coverage: ${coverage_pct}%** (threshold: ${min_coverage}%)"
        } >> "$GITHUB_STEP_SUMMARY"

        failed=0
        if [ "${{ steps.tests.outcome }}" = "failure" ]; then failed=1; fi
        if [ "$coverage_int" -lt "$min_coverage" ]; then failed=1; fi
        if [ "$failed" -eq 1 ]; then exit 1; fi
