name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 0. Lint, тесты и статические сканы уже прошли в PR (ci.yml). Здесь только
  # убеждаемся, что релизим код из main, т.е. прошедший через PR.
  verify:
    name: Verify commit is in main
    runs-on: ubuntu-latest
    steps:
      # Ручной запуск может собирать ветку (образы dev-latest / <ветка>-latest),
      # поэтому проверка только для тегов. Пропускаем шаги, а не всю джобу:
      # пропущенная джоба пропустила бы и все джобы, которые от неё зависят.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Commit is reachable from main
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=release::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not in main — release only commits merged via PR"
            exit 1
          fi

  # 0b. Сканы по базам уязвимостей: база обновляется, поэтому код, чистый на
  # момент PR, к релизу может получить новые CVE.
  vuln-scan:
    needs: verify
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: govulncheck
        if: ${{ !cancelled() }}
        run: |
          status=0
          docker run --rm -v "$PWD:/src" -w /src golang:1.27 sh -c \
            'go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...' \
            > govulncheck.log 2>&1 || status=$?
          cat govulncheck.log
          if [ "$status" -ne 0 ]; then
            { echo "### ❌ govulncheck"; echo '```'; cat govulncheck.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=govulncheck::vulnerability reachable from our code (or govulncheck failed) — bump the module under 'Fixed in'; see log"
            exit 1
          fi
          echo "### ✅ govulncheck" >> "$GITHUB_STEP_SUMMARY"

      - name: trivy fs
        if: ${{ !cancelled() }}
        run: |
          status=0
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:latest fs \
            --no-progress --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            /src > trivy.log 2>&1 || status=$?
          cat trivy.log
          if [ "$status" -ne 0 ]; then
            { echo "### ❌ trivy fs: HIGH/CRITICAL"; echo '```'; cat trivy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=trivy fs::HIGH/CRITICAL vulnerability in dependencies — bump the dep to the 'Fixed Version'; see log"
            exit 1
          fi
          echo "### ✅ trivy fs" >> "$GITHUB_STEP_SUMMARY"

  # 1. Сборка бинарников (только для тегов)
  build-binaries:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    name: Build Release Binaries
    runs-on: baremetal-mixaill
    container:
      image: golang:1.27
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          BINARY_NAME="auto_ai_router-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME="${BINARY_NAME}.exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.Commit=${{ github.sha }}" -o "${BINARY_NAME}" ./cmd/server
          if [ "${{ matrix.goos }}" = "windows" ]; then zip "${BINARY_NAME}.zip" "${BINARY_NAME}"; else tar czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"; fi
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  # 2. Сборка Docker (для веток и для тегов).
  build-docker:
    needs: verify
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.repo.outputs.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Lowercase repo name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=stable-latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
      - name: Build
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}

      - name: Build (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  scan-image:
    needs: build-docker
    name: Scan Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKLE_VERSION: v0.4.15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: image

      - name: trivy image
        if: ${{ !cancelled() }}
        run: |
          status=0
          docker run --rm -v "$PWD/image:/image:ro" aquasec/trivy:latest image \
            --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --input /image/image.tar > trivy-image.log 2>&1 || status=$?
          cat trivy-image.log
          if [ "$status" -ne 0 ]; then
            { echo "### ❌ trivy image: HIGH/CRITICAL"; echo '```'; cat trivy-image.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=trivy image::HIGH/CRITICAL vulnerabilities in the image — bump the base image / Go version / deps; see log"
            exit 1
          fi
          echo "### ✅ trivy image" >> "$GITHUB_STEP_SUMMARY"

      - name: dockle
        if: ${{ !cancelled() }}
        run: |
          v=${DOCKLE_VERSION#v}
          tarball="dockle_${v}_Linux-64bit.tar.gz"
          base="https://github.com/goodwithtech/dockle/releases/download/${DOCKLE_VERSION}"
          cd "$RUNNER_TEMP"
          wget -q "${base}/${tarball}" "${base}/dockle_${v}_checksums.txt"
          grep " ${tarball}\$" "dockle_${v}_checksums.txt" | sha256sum -c - \
            || { echo "::error title=dockle::${tarball} checksum mismatch"; exit 1; }
          tar xzf "$tarball" dockle
          cd "$GITHUB_WORKSPACE"

          status=0
          "$RUNNER_TEMP/dockle" --exit-code 1 --exit-level warn --input image/image.tar > dockle.log 2>&1 || status=$?
          cat dockle.log
          if [ "$status" -ne 0 ]; then
            { echo "### ❌ dockle"; echo '```'; cat dockle.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=dockle::image best-practice check failed (WARN or worse) — see log"
            exit 1
          fi
          echo "### ✅ dockle" >> "$GITHUB_STEP_SUMMARY"

  # 3. Публикация: пушим в GHCR ровно тот tar, который прошёл проверки
  publish-docker:
    needs: [build-docker, vuln-scan, scan-image]
    name: Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: image
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker load -i image/image.tar
          docker image push --all-tags "$IMAGE"
        env:
          IMAGE: ${{ needs.build-docker.outputs.image }}

  upload-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries, vuln-scan, scan-image, publish-docker]
    runs-on: baremetal-mixaill
    container:
      image: ubuntu:24.04
    steps:
      - name: Install gh
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gh >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binary-*
      - name: Upload assets to existing release
        run: |
          for file in artifacts/**/*; do
            if [ -f "$file" ]; then gh release upload "$TAG" "$file" --clobber; fi
          done
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
