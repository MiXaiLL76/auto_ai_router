name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
    # Временно для тестов, надо удалить
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 0. Проверка качества кода (fmt, lint, tests)
  # quality-check:
  #   name: Quality Check
  #   uses: ./.github/workflows/lint.yml

  # 1. Сборка бинарников (только для тегов)
  build-binaries:
    # needs: quality-check
    if: startsWith(github.ref, 'refs/tags/')
    name: Build Release Binaries
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          BINARY_NAME="auto_ai_router-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME="${BINARY_NAME}.exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.Commit=${{ github.sha }}" -o "${BINARY_NAME}" ./cmd/server
          if [ "${{ matrix.goos }}" = "windows" ]; then zip "${BINARY_NAME}.zip" "${BINARY_NAME}"; else tar czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"; fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  # 2. Сборка Docker (для веток и для тегов)
  build-docker:
    # needs: quality-check
    name: Build and Push Docker Image
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase repo name
        id: repo
        run: echo "repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=stable-latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-

      - name: Build GHCR auth for kaniko
        id: ghcr-auth
        run: |
          auth=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GHCR_PUSH_TOKEN }}" | base64 -w0)
          echo "config={\"auths\":{\"ghcr.io\":{\"auth\":\"${auth}\"}}}" >> "$GITHUB_OUTPUT"

      - name: Build kaniko args
        id: kaniko
        env:
          DESTINATIONS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          version="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          {
            echo "args<<KANIKO_ARGS_EOF"
            echo "--context=dir:///github/workspace"
            echo "--dockerfile=/github/workspace/Dockerfile"
            printf '%s\n' "$DESTINATIONS" | while IFS= read -r tag; do
              if [ -z "$tag" ]; then continue; fi
              echo "--destination=$tag"
            done
            printf '%s\n' "$LABELS" | while IFS= read -r label; do
              if [ -z "$label" ]; then continue; fi
              echo "--label=$label"
            done
            echo "--build-arg=VERSION=${version}"
            echo "--build-arg=COMMIT=${{ github.sha }}"
            echo "--cache=true"
            echo "--cache-repo=ghcr.io/${{ steps.repo.outputs.repository }}/cache"
            echo "KANIKO_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push with kaniko
        uses: ./.github/actions/kaniko-build
        with:
          args: ${{ steps.kaniko.outputs.args }}
          registry_auth_json: ${{ steps.ghcr-auth.outputs.config }}

  # 3. Загрузка assets в существующий релиз (только для тегов)
  upload-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries, build-docker]
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload assets to existing release
        run: |
          for file in artifacts/**/*; do
            if [ -f "$file" ]; then gh release upload "${{ github.ref_name }}" "$file" --clobber; fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
