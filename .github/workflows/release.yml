name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read  # lint.yml (workflow_call) explain job reads its own run log

jobs:
  # 0. Проверка качества кода (fmt, lint, tests)
  quality-check:
    name: Quality Check
    uses: ./.github/workflows/lint.yml

  # 0b. Security-сканы исходников (trufflehog, semgrep, trivy fs, clamav)
  security-check:
    name: Security Check
    uses: ./.github/workflows/security.yml

  # 1. Сборка бинарников (только для тегов)
  build-binaries:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/')
    name: Build Release Binaries
    runs-on: baremetal-mixaill
    container:
      image: golang:1.27
      volumes:
        - go-mod:/go/pkg/mod
        - go-build:/root/.cache/go-build
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          BINARY_NAME="auto_ai_router-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME="${BINARY_NAME}.exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.Commit=${{ github.sha }}" -o "${BINARY_NAME}" ./cmd/server
          if [ "${{ matrix.goos }}" = "windows" ]; then zip "${BINARY_NAME}.zip" "${BINARY_NAME}"; else tar czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"; fi
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  # 2. Сборка Docker (для веток и для тегов)
  build-docker:
    needs: quality-check
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=stable-latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}

      - name: Build and push (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}

  scan-image:
    needs: build-docker
    name: Scan Docker Image
    runs-on: baremetal-mixaill
    container:
      image: aquasec/trivy:latest
      volumes:
        - trivy-cache:/root/.cache/trivy
    env:
      DOCKLE_VERSION: v0.4.15
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DOCKLE_USERNAME: ${{ github.actor }}
      DOCKLE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Image ref
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${repo}:sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: trivy image
        if: ${{ !cancelled() }}
        run: |
          status=0
          trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "$IMAGE" > trivy-image.log 2>&1 || status=$?
          cat trivy-image.log
          if [ "$status" -ne 0 ]; then
            { echo "### ❌ trivy image: HIGH/CRITICAL in ${IMAGE}"; echo '```'; cat trivy-image.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=trivy image::HIGH/CRITICAL vulnerabilities in ${IMAGE} — bump the base image / Go version / deps; see log"
            exit 1
          fi
          echo "### ✅ trivy image: ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: dockle
        if: ${{ !cancelled() }}
        run: |
          v=${DOCKLE_VERSION#v}
          tarball="dockle_${v}_Linux-64bit.tar.gz"
          base="https://github.com/goodwithtech/dockle/releases/download/${DOCKLE_VERSION}"
          cd /tmp
          wget -q "${base}/${tarball}" "${base}/dockle_${v}_checksums.txt"
          grep " ${tarball}\$" "dockle_${v}_checksums.txt" | sha256sum -c - \
            || { echo "::error title=dockle::${tarball} checksum mismatch"; exit 1; }
          tar xzf "$tarball" -C /usr/local/bin dockle
          cd "$GITHUB_WORKSPACE"

          status=0
          dockle --exit-code 1 --exit-level warn "$IMAGE" > dockle.log 2>&1 || status=$?
          cat dockle.log
          if [ "$status" -ne 0 ]; then
            { echo "### ❌ dockle: ${IMAGE}"; echo '```'; cat dockle.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=dockle::image best-practice check failed (WARN or worse) — see log"
            exit 1
          fi
          echo "### ✅ dockle: ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"


  upload-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries, build-docker, security-check, scan-image]
    runs-on: baremetal-mixaill
    container:
      image: ubuntu:24.04
    steps:
      - name: Install gh
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gh >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # Tag name goes through env, not ${{ }} inside the script: a crafted tag
      # name would otherwise be spliced into the shell as code.
      - name: Upload assets to existing release
        run: |
          for file in artifacts/**/*; do
            if [ -f "$file" ]; then gh release upload "$TAG" "$file" --clobber; fi
          done
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
