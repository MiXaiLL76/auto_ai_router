name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
    # Временно для тестов, надо удалить
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 0. Проверка качества кода (fmt, lint, tests)
  quality-check:
    name: Quality Check
    uses: ./.github/workflows/lint.yml

  # 1. Сборка бинарников (только для тегов)
  build-binaries:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/')
    name: Build Release Binaries
    runs-on: arc-air-runners
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          BINARY_NAME="auto_ai_router-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && BINARY_NAME="${BINARY_NAME}.exe"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.Commit=${{ github.sha }}" -o "${BINARY_NAME}" ./cmd/server
          if [ "${{ matrix.goos }}" = "windows" ]; then zip "${BINARY_NAME}.zip" "${BINARY_NAME}"; else tar czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"; fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  # 2. Сборка Docker (для веток и для тегов)
  build-docker:
    needs: quality-check
    name: Build and Push Docker Image
    runs-on: arc-air-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase repo name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=stable-latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-

      # arc-air-runners работает в ARC containerMode: kubernetes без dind,
      # поэтому docker/build-push-action (нужен демон) здесь не запустится —
      # см. operators/README.md. Собираем и пушим через kaniko, как в
      # VSELLM_SITE/.github/actions/kaniko-build-*: он сам контейнерный
      # action и не требует демона. Число тегов из meta.outputs.tags не
      # фиксировано, поэтому не composite-action со статичными args, а
      # fromJSON-массив, собранный на лету.
      - name: Write GHCR auth for kaniko
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.docker-config"
          auth=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "${GITHUB_WORKSPACE}/.docker-config/config.json"

      - name: Build kaniko args
        id: kaniko
        env:
          DESTINATIONS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          version="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"

          json_escape() {
            local s=$1
            s=${s//\\/\\\\}
            s=${s//\"/\\\"}
            printf '%s' "$s"
          }

          args='["--context=dir:///github/workspace","--dockerfile=/github/workspace/Dockerfile"'
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            args="${args},\"--destination=$(json_escape "$tag")\""
          done <<< "${DESTINATIONS}"
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            args="${args},\"--label=$(json_escape "$label")\""
          done <<< "${LABELS}"
          args="${args},\"--build-arg=VERSION=${version}\",\"--build-arg=COMMIT=${{ github.sha }}\""
          args="${args},\"--cache=true\",\"--cache-repo=ghcr.io/${{ steps.repo.outputs.repository }}/cache\"]"
          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Build and push with kaniko
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: /github/workspace/.docker-config
        with:
          args: ${{ fromJSON(steps.kaniko.outputs.args) }}

  # 3. Загрузка assets в существующий релиз (только для тегов)
  upload-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries, build-docker]
    runs-on: arc-air-runners
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload assets to existing release
        run: |
          for file in artifacts/**/*; do
            [ -f "$file" ] && gh release upload "${{ github.ref_name }}" "$file" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
