version: 2
updates:
  # Workflow actions are pinned to commit SHAs (semgrep
  # github-actions-mutable-action-tag); Dependabot bumps the SHA together
  # with the "# vX.Y.Z" comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
