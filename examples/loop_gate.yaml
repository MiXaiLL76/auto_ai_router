# Loop gate example: watch streamed vLLM generations for loops; LOOP_GATE_MODE=enforce
# restarts or cuts them.
# Docs: docs/advanced/loop_gate.md

server:
  port: 8080
  master_key: os.environ/ROUTER_MASTER_KEY

loop_gate:
  mode: os.environ/LOOP_GATE_MODE # off | observe | enforce
  ngram: 32
  arm_words: 3000
  min_repeat: 5
  min_ratio: 0.35
  max_attempts: 3
  retry_deadline: 10m
  retry_presence_penalty: [1.0, 1.5]
  force_stream: true

credentials:
  - name: vllm_qwen
    type: vllm
    base_url: http://vllm-qwen:8000
    rpm: -1
    models:
      - name: qwen3.6
      - name: qwen-judge
        loop_gate:
          mode: observe

monitoring:
  prometheus_enabled: true
