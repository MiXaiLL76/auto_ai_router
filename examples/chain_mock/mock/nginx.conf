worker_processes 1;
events {
  worker_connections 1024;
}

http {
  # Deliberately dumb: always 200, always the same body, no state, no
  # scripting. The cascade/banning behavior in this demo comes entirely from
  # the real router logic (RPM/TPM budget -> 429 -> fail2ban -> priority
  # cascade), not from anything the mock does.
  server {
    listen 9002;
    location / {
      default_type application/json;
      return 200 '{"id":"chatcmpl-mock2","object":"chat.completion","created":0,"model":"mock","choices":[{"index":0,"message":{"role":"assistant","content":"hello from mock2"},"finish_reason":"stop"}],"usage":{"prompt_tokens":5,"completion_tokens":5,"total_tokens":10}}';
    }
  }

  server {
    listen 9003;
    location / {
      default_type application/json;
      return 200 '{"id":"chatcmpl-mock3","object":"chat.completion","created":0,"model":"mock","choices":[{"index":0,"message":{"role":"assistant","content":"hello from mock3"},"finish_reason":"stop"}],"usage":{"prompt_tokens":5,"completion_tokens":5,"total_tokens":10}}';
    }
  }

  server {
    listen 9004;
    location / {
      default_type application/json;
      return 200 '{"id":"chatcmpl-mock4","object":"chat.completion","created":0,"model":"mock","choices":[{"index":0,"message":{"role":"assistant","content":"hello from mock4"},"finish_reason":"stop"}],"usage":{"prompt_tokens":5,"completion_tokens":5,"total_tokens":10}}';
    }
  }
}
