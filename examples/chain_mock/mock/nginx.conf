worker_processes 1;
events {
  worker_connections 2048;
}

http {
  access_log off;

  # Deliberately dumb upstream: every request gets the same static 200 with
  # usage.total_tokens = 10, no state, no rate limiting, no scripting. Every
  # interesting behaviour in this demo (per-tier priority grouping, local
  # cumulative caps, fail2ban bans, cascade, recovery) comes entirely from the
  # real router logic reacting to the rpm/tpm budgets in the *:config.yaml
  # files — never from anything the mock does.
  server {
    listen 9100;

    # Chat Completions — the only endpoint the leaf credentials call.
    location / {
      default_type application/json;
      return 200 '{"id":"chatcmpl-mock","object":"chat.completion","created":0,"model":"mock","choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}],"usage":{"prompt_tokens":5,"completion_tokens":5,"total_tokens":10}}';
    }
  }
}
