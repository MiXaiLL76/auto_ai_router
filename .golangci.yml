version: "2"

linters:
  default: standard
  enable:
    - gosec
    - revive
    - gocritic
    - bodyclose
    - noctx
    - sqlclosecheck
  settings:
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G404
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - linters:
          - revive
        text: "^exported:"
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
          - gocritic
          - revive
          - gocyclo
